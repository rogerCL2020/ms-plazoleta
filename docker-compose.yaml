
services:
  mysql-plazoleta:
    image: mysql:8.4
    container_name: mysql-plazoleta
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local}
      MYSQL_DATABASE: pragma_plazoleta
      MYSQL_USER: plazoleta_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password_local}

    ports:
      - "3308:3306"

    volumes:
      - plazoleta_mysql_data:/var/lib/mysql
      - ./database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  plazoleta_mysql_data:
    name: plazoleta_mysql_data
